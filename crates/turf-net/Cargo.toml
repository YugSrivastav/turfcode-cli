[package]
name = "turf-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tokio WebSocket P2P encrypted tunnel and state synchronization for TurfCode"

[dependencies]
turf-protocol = { path = "../turf-protocol" }
turf-core = { path = "../turf-core" }
tokio = { workspace = true }
tokio-tungstenite = "0.24"
aes-gcm = "0.10"
sha2 = "0.10"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
rand = "0.8"

[[bin]]
name = "turf"
path = "src/bin/turf.rs"

[[bin]]
name = "turfcode"
path = "src/bin/turfcode.rs"

[dev-dependencies]
tempfile = "3"
