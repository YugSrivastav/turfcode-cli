[package]
name = "turf-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for TurfCode: atomic file locking, intent board, and git worktrees"

[dependencies]
turf-protocol = { path = "../turf-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
parking_lot = "0.12"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
