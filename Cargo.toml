[workspace]
resolver = "2"
members = [
    "crates/turf-pty",
    "crates/turf-vte",
    "crates/turf-protocol",
    "crates/turf-core",
    "crates/turf-tui",
    "crates/turf-net",
    "crates/turf-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TurfCode Team"]

[workspace.dependencies]
portable-pty = "0.8"
vte = "0.14"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
unicode-width = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
anyhow = "1"
